<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c88a3c"/>
      <stop offset="60%" stop-color="#8c5028"/>
      <stop offset="100%" stop-color="#4a2810"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="512" cy="512" r="472" fill="url(#bg)" stroke="#3c1a08" stroke-width="10"/>
  <circle cx="512" cy="512" r="457" fill="none" stroke="rgba(255,255,240,0.15)" stroke-width="2"/>

  <!-- Stylized D letter -->
  <g fill="#f5ebc8">
    <!-- Vertical bar -->
    <rect x="432" y="252" width="140" height="520" rx="25"/>
    <!-- Arc for D curve -->
    <path d="M572,252 A280,280 0 0,1 572,772" fill="none" stroke="#f5ebc8" stroke-width="55" stroke-linecap="round"/>
  </g>

  <!-- Inner cutout -->
  <path d="M572,352 A170,170 0 0,1 572,672" fill="none" stroke="#b48246" stroke-width="35" stroke-linecap="round"/>

  <!-- Signal bars (top right) -->
  <g fill="none" stroke-width="2">
    <rect x="732" y="260" width="30" height="40" fill="#50a0c8" stroke="#28648c" rx="3"/>
    <rect x="774" y="230" width="30" height="68" fill="#64b4d2" stroke="#28648c" rx="3"/>
    <rect x="816" y="200" width="30" height="96" fill="#8cc8e6" stroke="#28648c" rx="3"/>
    <rect x="858" y="160" width="30" height="128" fill="#c8e6fa" stroke="#28648c" rx="3"/>
  </g>

  <!-- Dot grid (bottom center) -->
  <g fill="rgba(245,235,200,0.5)">
    <circle cx="412" cy="792" r="10"/>
    <circle cx="462" cy="792" r="8"/>
    <circle cx="512" cy="792" r="12"/>
    <circle cx="562" cy="792" r="8"/>
    <circle cx="612" cy="792" r="10"/>
    <circle cx="437" cy="832" r="7"/>
    <circle cx="487" cy="832" r="10"/>
    <circle cx="537" cy="832" r="10"/>
    <circle cx="587" cy="832" r="7"/>
    <circle cx="462" cy="872" r="6"/>
    <circle cx="512" cy="872" r="8"/>
    <circle cx="562" cy="872" r="6"/>
  </g>
</svg>
