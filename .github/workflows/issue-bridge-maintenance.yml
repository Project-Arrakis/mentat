name: ACP Issue Bridge — Maintenance (private)

# Responsibility (spec section 55/61/75): keep the private label taxonomy
# bootstrapped, publish this repo's config checksum, and verify it matches
# the public repo's published checksum (drift detection without needing
# `contents:read` on the other repository — see
# docs/issue-bridge/synchronization-policy.md).

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *" # daily
  push:
    branches:
      - main
    paths:
      - ".github/acp-issue-bridge.yml"
      - ".github/scripts/issue-bridge/**"

permissions:
  contents: read
  issues: write

jobs:
  bootstrap-and-check:
    name: bootstrap-and-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Bootstrap private labels (own repo, native token)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/issue-bridge/maintenance-bootstrap-labels.mjs private

      - name: Publish this repo's config checksum (own repo, native token)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/issue-bridge/maintenance-config-drift.mjs publish

      - name: Mint ACP Issue Bridge installation token
        id: bridge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACP_ISSUE_BRIDGE_APP_ID }}
          private-key: ${{ secrets.ACP_ISSUE_BRIDGE_PRIVATE_KEY }}
          repositories: |
            arrakis-control-panel
            acp-discordbot
          permission-issues: write
          permission-metadata: read

      - name: Check config drift against the public repo (App token, issues:read only)
        env:
          ACP_BRIDGE_TOKEN: ${{ steps.bridge-token.outputs.token }}
        run: node .github/scripts/issue-bridge/maintenance-config-drift.mjs check
