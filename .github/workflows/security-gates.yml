name: Security Gates

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate

  # Note: `actions/dependency-review-action` is intentionally not run here.
  # It requires the repository Dependency Graph API, which GitHub only
  # serves for private repositories when GitHub Advanced Security (a paid
  # Team/Enterprise add-on) is enabled. This repo is private on a personal
  # plan (`security_and_analysis` is unset, code scanning/dependency graph
  # both 404), so the action fails unconditionally with "Dependency review
  # is not supported on this repository" on every PR — a platform
  # limitation, not something fixable via workflow configuration. The
  # `dependency-audit` job above (`npm audit`) already covers the same
  # dependency tree without requiring GHAS. If this repo is ever made
  # public, or GHAS is licensed for it, this job can be reintroduced.

  # semgrep-sast/secret-scan used to reimplement gitleaks/semgrep inline
  # here (secret-scan via gitleaks/gitleaks-action, which started
  # requiring a paid org-account license and needed its own
  # GITLEAKS_LICENSE wiring fix). Both now call the org-shared
  # reusable-security-scan.yml (raw gitleaks CLI, sidesteps the license
  # requirement entirely) instead, so a fix lands once in .github and
  # every caller gets it, matching the same consolidation already done
  # in dune-ops-observability-addon. trivy-filesystem below is not yet
  # converted (kept inline) pending that same follow-up.
  semgrep-sast:
    uses: Project-Arrakis/.github/.github/workflows/reusable-security-scan.yml@main
    with:
      run-gitleaks: false
      run-trivy: false
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  secret-scan:
    uses: Project-Arrakis/.github/.github/workflows/reusable-security-scan.yml@main
    with:
      run-semgrep: false
      run-trivy: false
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  personal-identifier-guard:
    name: personal-identifier-guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Block known personal IPs/hostnames
        run: bash tests/no-personal-identifiers.sh

  hadolint:
    name: hadolint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install hadolint
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 -o /usr/local/bin/hadolint
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /usr/local/bin/hadolint" | sha256sum -c -
          chmod +x /usr/local/bin/hadolint
      - name: Lint Dockerfile
        run: hadolint Dockerfile

  trivy-filesystem:
    name: trivy-filesystem
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true
          skip-dirs: node_modules,.git

  trivy-image:
    name: trivy-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build runtime image
        run: |
          for i in 1 2 3; do
            docker build -t arrakis-control-panel:${{ github.sha }} . && exit 0
            echo "Docker build attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "Docker build failed after 3 attempts"
          exit 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: arrakis-control-panel:${{ github.sha }}
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true
