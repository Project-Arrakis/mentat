name: Security Gates

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate

  # Note: `actions/dependency-review-action` is intentionally not run here.
  # It requires the repository Dependency Graph API, which GitHub only
  # serves for private repositories when GitHub Advanced Security (a paid
  # Team/Enterprise add-on) is enabled. This repo is private on a personal
  # plan (`security_and_analysis` is unset, code scanning/dependency graph
  # both 404), so the action fails unconditionally with "Dependency review
  # is not supported on this repository" on every PR — a platform
  # limitation, not something fixable via workflow configuration. The
  # `dependency-audit` job above (`npm audit`) already covers the same
  # dependency tree without requiring GHAS. If this repo is ever made
  # public, or GHAS is licensed for it, this job can be reintroduced.

  semgrep-sast:
    name: semgrep-sast
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install semgrep==1.167.0
      - name: Run Semgrep
        run: >
          semgrep scan
          --config p/default
          --config p/secrets
          --error
          --severity ERROR
          --severity WARNING
          --exclude node_modules
          --exclude .git
          --exclude package-lock.json
          .

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # gitleaks/gitleaks-action requires a paid license for organization
        # accounts (this repo moved from a personal account to the
        # Project-Arrakis org) -- the underlying CLI itself is free/OSS, so
        # install and run it directly instead of the marketplace action.
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  personal-identifier-guard:
    name: personal-identifier-guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Block known personal IPs/hostnames
        run: bash tests/no-personal-identifiers.sh

  trivy-filesystem:
    name: trivy-filesystem
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true
          skip-dirs: node_modules,.git

  trivy-image:
    name: trivy-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build runtime image
        run: |
          for i in 1 2 3; do
            docker build -t arrakis-control-panel:${{ github.sha }} . && exit 0
            echo "Docker build attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "Docker build failed after 3 attempts"
          exit 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: arrakis-control-panel:${{ github.sha }}
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true
