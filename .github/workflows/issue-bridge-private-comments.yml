name: ACP Issue Bridge — Private Comment Processor

# Responsibility (docs/issue-bridge/architecture.md): the ONLY path by which
# private -> public publication can happen. Ignores public-mirrored/bridge
# comments, detects a command, authorizes the actor, evaluates security
# state, scans content, and publishes ONLY if every check passes. Fails
# closed on any ambiguity (spec section 2/60).
#
# NOTE: sections 55/60 of the implementation spec suggest a separate
# `issue-bridge-private-security.yml` workflow. That is deliberately
# consolidated into this single workflow instead: `/security` is just one
# more command branch inside the same comment-command state machine
# (private-comment-created.mjs), and a second workflow reacting to the same
# `issue_comment.created` event would have to independently re-parse the
# same comment to decide "is this the security case?", adding a race/
# ordering hazard for zero separation-of-concerns benefit. See
# docs/issue-bridge/architecture.md "Workflow consolidation decision".

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: acp-issue-bridge-private-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process-comment:
    name: process-comment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Mint ACP Issue Bridge installation token
        id: bridge-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACP_ISSUE_BRIDGE_APP_ID }}
          private-key: ${{ secrets.ACP_ISSUE_BRIDGE_PRIVATE_KEY }}
          repositories: |
            mentat
            mentat-adjutant
          # Explicit narrowing (belt-and-suspenders on top of the App's own
          # least-privilege grant, section 5/85): errors loudly if the App's
          # installation ever has more or less than this, instead of silently
          # minting a broader token than intended.
          permission-issues: write
          permission-metadata: read

      - name: Process private comment
        env:
          ACP_BRIDGE_TOKEN: ${{ steps.bridge-token.outputs.token }}
          ACP_BRIDGE_BOT_LOGIN: ${{ steps.bridge-token.outputs.app-slug }}[bot]
        run: node .github/scripts/issue-bridge/private-comment-created.mjs
