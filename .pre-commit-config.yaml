repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ggshield
        name: ggshield
        entry: ggshield secret scan pre-commit
        language: system
        pass_filenames: false
        always_run: true
        verbose: false

      - id: trivy
        name: trivy
        entry: trivy fs --scanners secret --severity HIGH,CRITICAL .
        language: system
        pass_filenames: false
        always_run: true
        verbose: false

      - id: semgrep
        name: semgrep
        entry: semgrep --error --config p/default
        language: system
        pass_filenames: false
        always_run: true
        verbose: false

      - id: discord-bot-tests
        name: Discord Bot Test Harness
        entry: node test/discord-bot-test-harness.js
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: no-real-ips-or-hostnames
        name: block known personal IPs/hostnames from this project's history
        entry: bash tests/no-personal-identifiers.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: false
